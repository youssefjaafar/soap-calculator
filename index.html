// ---- Calculation engine -----------------------------------------------------

const sum = (values) => values.reduce((a, b) => a + b, 0);
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const round1 = (v) => Math.round(v * 10) / 10;

function calculateRecipe({ oilGrams, pct, superfat, waterRatio, eoRate }) {
  const oils = OILS.map((oil) => {
    const grams = oilGrams * (pct[oil.key] / 100);
    return { ...oil, pct: pct[oil.key], grams, lye: grams * oil.sap };
  });
  const pctTotal = sum(oils.map((o) => o.pct));
  const oilTotal = sum(oils.map((o) => o.grams));
  const unadjustedLye = sum(oils.map((o) => o.lye));
  const lye = unadjustedLye * (1 - superfat / 100);
  const water = lye * waterRatio;
  const eo = oilGrams * (eoRate / 1000);
  return {
    oils,
    pctTotal,
    oilTotal,
    unadjustedLye,
    lye,
    water,
    eo,
    total: oilTotal + lye + water + eo,
    lyeConcentration: lye + water > 0 ? (lye / (lye + water)) * 100 : 0,
    balanced: Math.abs(pctTotal - 100) < 0.001,
  };
}

// Scale the blend proportionally to 100%, pushing any rounding drift onto the largest oil.
function normalizeBlend(pct) {
  const total = sum(OILS.map((o) => pct[o.key]));
  if (total <= 0) return { ...DEFAULTS.pct };
  const next = Object.fromEntries(OILS.map((o) => [o.key, round1((pct[o.key] / total) * 100)]));
  const drift = round1(100 - sum(Object.values(next)));
  if (drift !== 0) {
    const largest = OILS.reduce((a, o) => (next[o.key] > next[a.key] ? o : a), OILS[0]);
    next[largest.key] = round1(next[largest.key] + drift);
  }
  return next;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULTS;
    const saved = JSON.parse(raw);
    const num = (v, lim, fallback) => (Number.isFinite(v) ? clamp(v, lim.min, lim.max) : fallback);
    return {
      oilGrams: num(saved.oilGrams, LIMITS.oilGrams, DEFAULTS.oilGrams),
      unit: UNITS[saved.unit] ? saved.unit : DEFAULTS.unit,
      waterRatio: num(saved.waterRatio, LIMITS.waterRatio, DEFAULTS.waterRatio),
      superfat: num(saved.superfat, LIMITS.superfat, DEFAULTS.superfat),
      eoRate: num(saved.eoRate, LIMITS.eoRate, DEFAULTS.eoRate),
      pct: Object.fromEntries(
        OILS.map((o) => [o.key, num(saved.pct?.[o.key], LIMITS.pct, DEFAULTS.pct[o.key])])
      ),
    };
  } catch {
    return DEFAULTS;
  }
}

// A saved choice wins; otherwise follow the browser's language.
function loadLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (STRINGS[saved]) return saved;
  } catch {}
  return (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
}

function applyLang(lang) {
  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = STRINGS[lang].docTitle;
}

// ---- Formatting -------------------------------------------------------------

// Numbers use Western digits in both languages, matching what kitchen scales display.
const grams2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtG = (g) => grams2.format(g);
const fmtPct = (p, digits = 1) =>
  `${new Intl.NumberFormat('en-US', { maximumFractionDigits: digits }).format(p)}%`;

function makeLocale(lang) {
  const t = STRINGS[lang];
  return {
    lang,
    t,
    rtl: lang === 'ar',
    // A weight in grams with two decimals, e.g. "134.76 g".
    fmtW: (g) => `${fmtG(g)} ${t.units.g}`,
    // A weight converted to one of UNITS, e.g. "35.27 oz".
    fmtU: (g, unit) => {
      const { gramsPer, decimals } = UNITS[unit];
      const digits = unit === 'g' ? 0 : decimals;
      const n = new Intl.NumberFormat('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(g / gramsPer);
      return `${n} ${t.units[unit]}`;
    },
  };
}

const LocaleContext = createContext(makeLocale('en'));
const useLocale = () => useContext(LocaleContext);

function recipeText(r, s, locale) {
  const { t, fmtW, rtl } = locale;
  // English lines are padded into columns; Arabic is right-to-left, so a plain "label: value" reads better.
  const line = (label, value) => (rtl ? `${label}: ${value}` : `${label.padEnd(28, ' ')}${value.padStart(12, ' ')}`);
  return [
    t.recipeHeading,
    t.recipeMeta(fmtW(s.oilGrams), fmtPct(s.superfat), s.waterRatio.toFixed(1)),
    '',
    t.groupOils.toUpperCase(),
    ...r.oils.map((o) => line(`${t.oils[o.key]} ${fmtPct(o.pct)}`, fmtW(o.grams))),
    '',
    t.groupLye.toUpperCase(),
    line(t.lye, fmtW(r.lye)),
    line(t.water, fmtW(r.water)),
    '',
    t.groupAdditives.toUpperCase(),
    line(t.eoLine(s.eoRate), fmtW(r.eo)),
    '',
    line(t.totalLine, fmtW(r.total)),
  ].join('\n');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch {
      return false;
    }
  }
}

function useInView(ref) {
  const [inView, setInView] = useState(true);
  useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(([entry]) => setInView(entry.isIntersecting));
    io.observe(el);
    return () => io.disconnect();
  }, [ref]);
  return inView;
}

function NumberInput({ id, value, onCommit, min, max, step, decimals = 1, suffix, widthClass = 'w-16' }) {
  const format = (v) => String(Number(v.toFixed(decimals)));
  const [draft, setDraft] = useState(() => format(value));
  const [editing, setEditing] = useState(false);

  useEffect(() => {
    if (!editing) setDraft(format(value));
  }, [value, editing, decimals]);

  const commitDraft = () => {
    setEditing(false);
    if (draft === format(value)) return;
    const n = parseFloat(draft);
    const next = Number.isFinite(n) ? clamp(n, min, max) : value;
    onCommit(next);
    setDraft(format(next));
  };

  return (
    <div className="flex items-center rounded-md border border-line bg-well transition-colors focus-within:border-accent focus-within:ring-2 focus-within:ring-accent-soft">
      <input
        id={id}
        type="number"
        inputMode="decimal"
        min={min}
        max={max}
        step={step}
        value={draft}
        onFocus={() => setEditing(true)}
        onChange={(e) => {
          setDraft(e.target.value);
          const n = parseFloat(e.target.value);
          if (Number.isFinite(n) && n >= min && n <= max) onCommit(n);
        }}
        onBlur={commitDraft}
        onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }}
        className={`${widthClass} bg-transparent py-1.5 ps-2 text-end font-mono text-sm tabular-nums text-ink outline-none`}
      />
      {suffix && <span className="select-none whitespace-nowrap pe-2 ps-1 text-sm text-muted">{suffix}</span>}
    </div>
  );
}

function Range({ id, value, min, max, step, onChange, fill, label, valueText }) {
  const v = clamp(value, min, max);
  const pct = ((v - min) / (max - min)) * 100;
  return (
    <input
      id={id}
      type="range"
      className="range"
      min={min}
      max={max}
      step={step}
      value={v}
      onChange={(e) => onChange(parseFloat(e.target.value))}
      aria-label={label}
      aria-valuetext={valueText}
      style={{ '--pct': `${pct}%`, ...(fill ? { '--fill': fill } : null) }}
    />
  );
}

function PresetButtons({ pct, onApply }) {

      {PRESETS.map((p) => {

function BlendStatus({ pct, total, onScale, onBalance }) {
  const { t } = useLocale();
  const balanced = Math.abs(total - 100) < 0.001;
  const diff = total - 100;
  const scaleMax = Math.max(100, total);
  const canBalance = pct.coconut + pct.castor <= 100;
  return (
    <div className={`rounded-lg border px-4 py-3 ${balanced ? 'border-line bg-well' : 'border-warn-line bg-warn-soft'}`}>
      <div className="flex items-center justify-between gap-3 text-sm">
        <span aria-live="polite" className={`flex items-center gap-1.5 font-medium ${balanced ? 'text-ok' : 'text-warn'}`}>
          {balanced ? <CheckIcon /> : <WarnIcon />}
          {balanced ? t.totalOk : diff < 0 ? t.totalShort(fmtPct(-diff)) : t.totalOver(fmtPct(diff))}
        </span>
        <span className="font-mono tabular-nums text-ink">{fmtPct(total)}</span>
      </div>
      <div className="relative mt-2.5 h-2 overflow-hidden rounded-full bg-track" aria-hidden="true">
        <div className="flex h-full gap-[2px]" style={{ width: `${(total / scaleMax) * 100}%` }}>
          {OILS.filter((o) => pct[o.key] > 0).map((o) => (
            <span key={o.key} className="block h-full" style={{ flexGrow: pct[o.key], flexBasis: 0, background: o.color }} />
          ))}
        </div>
        {total > 100 && (
          <span className="absolute inset-y-0 w-[2px] bg-ink" style={{ insetInlineStart: `calc(${(100 / scaleMax) * 100}% - 1px)` }} />
        )}
      </div>
      {!balanced && (
        <div className="mt-3 flex flex-wrap items-center gap-2">
          <button
            type="button"
            onClick={onScale}
            disabled={total <= 0}
            className="rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-surface transition-opacity hover:opacity-90 disabled:opacity-40"
          >
            {t.scale}
          </button>
          <button
            type="button"
            onClick={onBalance}
            disabled={!canBalance}
            className="rounded-md border border-line bg-surface px-3 py-1.5 text-sm font-medium text-ink transition-colors hover:bg-well disabled:opacity-40"
          >
            {t.fillOlive}
          </button>
        </div>
      )}
    </div>
  );
}

// Scale under each bar. Logical positions, so 0% sits at the start edge in either direction.
function Ticks() {
  return (
    <div className="relative -mt-1 h-4" aria-hidden="true">
      {[0, 25, 50, 75, 100].map((t) => (
        <span key={t} className="absolute top-0 h-1.5 w-px bg-line" style={{ insetInlineStart: `calc(${t}% - ${t === 100 ? 1 : 0}px)` }} />
      ))}
      <span className="absolute start-0 top-1.5 font-mono text-[10px] text-muted">0%</span>
      <span className="absolute left-1/2 top-1.5 -translate-x-1/2 font-mono text-[10px] text-muted">50%</span>
      <span className="absolute end-0 top-1.5 font-mono text-[10px] text-muted">100%</span>
    </div>

}

function StackedBar({ title, note, segments, groups = {}, legend, shareLabel, hoverKey, onHover }) {
  const { rtl, fmtW, t } = useLocale();
  const shown = segments.filter((s) => s.value > 0);
  const total = sum(shown.map((s) => s.value));
  let cursor = 0;
  const placed = shown.map((s) => {
    const start = total ? cursor / total : 0;
    cursor += s.value;
    return { ...s, start, share: total ? s.value / total : 0 };
  });

  const isHit = (s) => hoverKey != null && (s.key === hoverKey || s.group === hoverKey);
  const hits = placed.filter(isHit);
  let tip = null;
  if (hits.length) {
    const first = hits[0];
    const last = hits[hits.length - 1];
    const value = sum(hits.map((s) => s.value));
    tip = {
      label: hits.length > 1 ? groups[hoverKey] : first.label,
      value,
      share: value / total,
      center: ((first.start + last.start + last.share) / 2) * 100,
    };
  }
  // Segments run from the start edge (right in Arabic), so the tooltip anchors to that edge too.
  const tipStyle = !tip
    ? null
    : tip.center < 18
      ? { insetInlineStart: 0 }
      : tip.center > 82
        ? { insetInlineEnd: 0 }
        : { insetInlineStart: `${tip.center}%`, transform: `translateX(${rtl ? 50 : -50}%)` };

  return (
    <figure className="m-0">
      <figcaption className="flex items-baseline justify-between gap-3">
        <span className="text-sm font-medium text-ink">{title}</span>
        <span className="text-xs text-muted">{note}</span>
      </figcaption>
      <div className="relative">
        {tip && (
          <div
            className="pointer-events-none absolute bottom-full z-10 whitespace-nowrap rounded-md border border-line bg-surface px-2.5 py-1.5 shadow-lg"
            style={tipStyle}
          >
            <div className="font-mono text-sm font-semibold tabular-nums text-ink">{fmtW(tip.value)}</div>
            <div className="text-xs text-ink-2">{tip.label} · {fmtPct(tip.share * 100)} {shareLabel}</div>
          </div>
        )}
        <div className="flex gap-[2px]" onMouseLeave={() => onHover(null)}>
          {placed.map((s, i) => (
            <div
              key={s.key}
              tabIndex={0}
              role="img"
              aria-label={t.segAria(s.label, fmtW(s.value), fmtPct(s.share * 100), shareLabel)}
              onMouseEnter={() => onHover(s.key)}
              onFocus={() => onHover(s.key)}
              onBlur={() => onHover(null)}
              className="min-w-[3px] py-2 transition-[flex-grow] duration-300 ease-out"
              style={{ flexGrow: s.value, flexBasis: 0 }}
            >
              <span
                className={`block h-6 transition-opacity duration-150 ${i === placed.length - 1 ? 'rounded-e-[4px]' : ''} ${
                  hits.length && !isHit(s) ? 'opacity-30' : ''
                }`}
                style={{ background: s.color }}
              />
            </div>
          ))}
        </div>
        <Ticks />
      </div>
      <ul className="mt-2 flex flex-wrap gap-x-5 gap-y-1.5">
        {legend.map((item) => (
          <li
            key={item.key}
            className="flex items-center gap-1.5 text-xs"
            onMouseEnter={() => onHover(item.key)}
            onMouseLeave={() => onHover(null)}
          >
            <Swatch colors={item.colors} />
            <span className="text-ink-2">{item.label}</span>
            <span className="font-mono tabular-nums text-ink">{fmtPct(total ? (item.value / total) * 100 : 0)}</span>
          </li>
        ))}
      </ul>
    </figure>
  );
}

function RecipeCard({ r, state, hoverKey, onHover, cardRef }) {
  const locale = useLocale();
  const { t, fmtW, fmtU } = locale;
  const { oilGrams, unit, superfat, waterRatio, eoRate } = state;
  const [copyState, setCopyState] = useState('idle');
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);

  const onCopy = async () => {
    const ok = await copyText(recipeText(r, state, locale));
    setCopyState(ok ? 'copied' : 'failed');
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setCopyState('idle'), 2200);
  };
  const ofOils = (g) => fmtPct((g / oilGrams) * 100);
  const oilsLabel = fmtU(oilGrams, 'g') + (unit !== 'g' ? ` (${fmtU(oilGrams, unit)})` : '');

  return (
    <section
      id="recipe"
      ref={cardRef}
      aria-labelledby="recipe-title"
      className="rounded-xl border border-line bg-surface shadow-[0_1px_2px_rgb(0_0_0/0.04),0_8px_24px_-12px_rgb(0_0_0/0.18)]"
    >
      <div className="flex flex-wrap items-start justify-between gap-3 px-5 pt-5 sm:px-6 sm:pt-6">
        <div className="min-w-0">
          <h2 id="recipe-title" className="font-display text-xl font-semibold leading-tight text-ink rtl:leading-snug">{t.recipeTitle}</h2>
          <p className="mt-1 text-sm text-muted">{t.recipeSub(oilsLabel, fmtPct(superfat), waterRatio.toFixed(1))}</p>
        </div>
        <button
          type="button"
          onClick={onCopy}
          disabled={!r.balanced}
          className="flex items-center gap-1.5 rounded-md border border-line bg-surface px-3 py-1.5 text-sm font-medium text-ink transition-colors hover:bg-well disabled:cursor-not-allowed disabled:opacity-40"
        >
          {copyState === 'copied' ? <CheckIcon /> : <CopyIcon />}
          {copyState === 'copied' ? t.copied : copyState === 'failed' ? t.copyFailed : t.copy}
        </button>
      </div>

      {!r.balanced && (
        <div className="mx-5 mt-4 flex gap-2.5 rounded-lg border border-warn-line bg-warn-soft px-3.5 py-3 text-sm text-warn sm:mx-6">
          <WarnIcon className="mt-0.5 h-4 w-4 shrink-0" />
          <p>
            <strong className="font-semibold">{t.unbalancedHead(fmtPct(r.pctTotal))}</strong>{' '}
            {t.unbalancedBody(fmtW(r.oilTotal), fmtW(oilGrams))}
          </p>
        </div>
      )}

      <div className={`px-2 pb-2 transition-opacity sm:px-3 ${r.balanced ? '' : 'opacity-60'}`}>
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr className="text-[11px] uppercase tracking-[0.12em] text-muted">
              <th scope="col" className="px-3 pt-4 text-start font-medium"><span className="sr-only">{t.colIngredient}</span></th>
              <th scope="col" className="whitespace-nowrap px-2 pt-4 text-end font-medium">{t.colPct}</th>
              <th scope="col" className="px-3 pt-4 text-end font-medium">{t.colWeight}</th>
            </tr>
          </thead>
          <tbody>
            <GroupRow label={t.groupOils} />
            {r.oils.map((o) => (
              <ItemRow
                key={o.key}
                id={o.key}
                color={o.color}
                name={t.oils[o.key]}
                detail={t.oilDetail(o.sap.toFixed(3), fmtW(o.lye))}
                pct={fmtPct(o.pct)}
                grams={o.grams}
                unit={unit}
                hoverKey={hoverKey}
                onHover={onHover}
              />
            ))}
            <ItemRow id="oils" name={t.allOils} pct={fmtPct(r.pctTotal)} grams={r.oilTotal} unit={unit} hoverKey={hoverKey} onHover={onHover} />

            <GroupRow label={t.groupLye} />
            <ItemRow
              id="lye"
              color={COLORS.lye}
              name={t.lye}
              detail={t.lyeDetail(fmtW(r.unadjustedLye), fmtPct(superfat))}
              pct={ofOils(r.lye)}
              grams={r.lye}
              unit={unit}
              strong
              hoverKey={hoverKey}
              onHover={onHover}
            />
            <ItemRow
              id="water"
              color={COLORS.water}
              name={t.water}
              detail={t.waterDetail(waterRatio.toFixed(1), `${r.lyeConcentration.toFixed(1)}%`)}
              pct={ofOils(r.water)}
              grams={r.water}
              unit={unit}
              strong
              hoverKey={hoverKey}
              onHover={onHover}
            />
            <tr>
              <td colSpan={3} className="px-3 pb-1 pt-2">
                <p className="flex items-start gap-2 text-xs text-ink-2">
                  <WarnIcon className="mt-px h-3.5 w-3.5 shrink-0 text-warn" />
                  {t.safety}
                </p>
              </td>
            </tr>

            <GroupRow label={t.groupAdditives} />
            <ItemRow
              id="eo"
              color={COLORS.eo}
              name={t.eo}
              detail={t.eoDetail(eoRate)}
              pct={ofOils(r.eo)}
              grams={r.eo}
              unit={unit}
              hoverKey={hoverKey}
              onHover={onHover}
            />
          </tbody>
        </table>

        <div className="mx-1 mb-2 mt-4 flex flex-wrap items-end justify-between gap-x-4 gap-y-1 rounded-lg bg-well px-4 py-4">
          <div>
            <div className="text-sm font-semibold text-ink">{t.totalTitle}</div>
            <div className="text-xs text-muted">{t.totalSub}</div>
          </div>
          <div className="text-end">
            <div className="text-3xl font-semibold tracking-tight text-ink">
              {fmtG(r.total)}<span className="ms-1.5 text-lg font-medium text-muted">{t.units.g}</span>
            </div>
            {unit !== 'g' && <div className="font-mono text-xs text-muted">{fmtU(r.total, unit)}</div>}
          </div>
        </div>
      </div>
    </section>
  );
}

function BreakdownCard({ r, hoverKey, onHover }) {
  const { t } = useLocale();
  const blend = r.oils.map((o) => ({ key: o.key, label: t.oils[o.key], value: o.grams, color: o.color }));
  const batch = [
    ...r.oils.map((o) => ({ key: o.key, group: 'oils', label: t.oils[o.key], value: o.grams, color: o.color })),
    { key: 'water', label: t.water, value: r.water, color: COLORS.water },
    { key: 'lye', label: t.lye, value: r.lye, color: COLORS.lye },
    { key: 'eo', label: t.eo, value: r.eo, color: COLORS.eo },
  ];
  return (
    <section aria-labelledby="breakdown-title" className={`rounded-xl border border-line bg-surface px-5 py-5 transition-opacity sm:px-6 sm:py-6 ${r.balanced ? '' : 'opacity-60'}`}>
      <h2 id="breakdown-title" className="font-display text-lg font-semibold leading-tight text-ink rtl:leading-snug">{t.breakdownTitle}</h2>
      <p className="mt-1 text-sm text-muted">{t.breakdownDesc}</p>
      <div className="mt-6 flex flex-col gap-8">
        <StackedBar
          title={t.blendTitle}
          note={t.blendNote}
          shareLabel={t.ofOils}
          segments={blend}
          legend={r.oils.map((o) => ({ key: o.key, label: t.oils[o.key], value: o.grams, colors: [o.color] }))}
          hoverKey={hoverKey}
          onHover={onHover}
        />
        <StackedBar
          title={t.wetTitle}
          note={t.wetNote}
          shareLabel={t.ofBatch}
          segments={batch}
          groups={{ oils: t.allOils }}
          legend={[
            { key: 'oils', label: t.legendOils, value: r.oilTotal, colors: r.oils.filter((o) => o.grams > 0).map((o) => o.color) },
            { key: 'water', label: t.water, value: r.water, colors: [COLORS.water] },
            { key: 'lye', label: t.lye, value: r.lye, colors: [COLORS.lye] },
            { key: 'eo', label: t.eo, value: r.eo, colors: [COLORS.eo] },
          ]}
          hoverKey={hoverKey}
          onHover={onHover}
        />
      </div>
    </section>
  );
}

function SummaryBar({ r }) {
  const { t, fmtW } = useLocale();
  return (
    <div
      className="rise fixed inset-x-0 bottom-0 z-20 border-t border-line bg-surface shadow-[0_-8px_24px_-12px_rgb(0_0_0/0.25)]"
      style={{ paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom, 0px))' }}
    >
      <div className="mx-auto flex max-w-6xl items-center gap-3 px-4 pt-3 sm:px-6">
        {r.balanced ? (
          <dl className="grid min-w-0 flex-1 grid-cols-3 gap-3">
            {[
              [t.barLye, r.lye],
              [t.barWater, r.water],
              [t.barTotal, r.total],
            ].map(([label, g]) => (
              <div key={label} className="min-w-0">
                <dt className="truncate text-[11px] uppercase tracking-[0.1em] text-muted">{label}</dt>
                <dd className="truncate font-mono text-sm font-medium tabular-nums text-ink">{fmtW(g)}</dd>
              </div>
            ))}
          </dl>
        ) : (
          <p className="flex min-w-0 flex-1 items-center gap-2 text-sm font-medium text-warn">
            <WarnIcon className="h-4 w-4 shrink-0" /> {t.barWarn(fmtPct(r.pctTotal))}
          </p>
        )}
        <button
          type="button"
          onClick={() => {
            const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            document.getElementById('recipe')?.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          }}
          aria-label={t.barRecipe}
          className="flex shrink-0 items-center gap-1 rounded-md border border-line px-2.5 py-1.5 text-sm font-medium text-ink hover:bg-well"
        >
          <DownIcon className="h-3.5 w-3.5" />
          <span className="hidden sm:inline">{t.barRecipe}</span>
        </button>
      </div>
    </div>
  );
}

// ---- App --------------------------------------------------------------------

const initialLang = loadLang();
applyLang(initialLang);

function SoapCalculator() {
  const [state, setState] = useState(loadState);
  const [lang, setLang] = useState(initialLang);
  const [hoverKey, setHoverKey] = useState(null);
  const recipeRef = useRef(null);
  const recipeInView = useInView(recipeRef);

  const locale = useMemo(() => makeLocale(lang), [lang]);
  const { t, fmtW, fmtU } = locale;
  const { oilGrams, unit, waterRatio, pct, superfat, eoRate } = state;
  const update = (patch) => setState((s) => ({ ...s, ...patch }));
  const setPct = (key, v) => setState((s) => ({ ...s, pct: { ...s.pct, [key]: v } }));

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }, [state]);

  // Before paint, so the new language never shows in the old direction.
  useLayoutEffect(() => {
    applyLang(lang);
    try { localStorage.setItem(LANG_KEY, lang); } catch {}
  }, [lang]);

  const r = useMemo(() => calculateRecipe(state), [state]);
  const u = UNITS[unit];
  const L = LIMITS;

  return (
    <LocaleContext.Provider value={locale}>
      <div className="mx-auto max-w-6xl px-4 pb-28 pt-8 sm:px-6 sm:pt-10">
        <header className="mb-7 flex flex-wrap items-end justify-between gap-4">
          <div className="min-w-0">
            <p className="font-mono text-[11px] uppercase tracking-[0.16em] text-muted">{t.eyebrow}</p>
            <h1 className="mt-1.5 font-display text-[2rem] font-bold leading-[1.05] tracking-tight text-ink sm:text-[2.6rem] rtl:leading-[1.35]">
              {t.title}
            </h1>
            <p className="mt-2 max-w-xl text-[15px] text-ink-2">{t.intro}</p>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <LanguageToggle value={lang} onChange={setLang} />
            <button
              type="button"
              onClick={() => setState(DEFAULTS)}
              className="flex items-center gap-1.5 rounded-md border border-line bg-surface px-3 py-1.5 text-sm font-medium text-ink transition-colors hover:bg-well"
            >
              <ResetIcon /> {t.reset}
            </button>
          </div>
        </header>

        <div className="grid items-start gap-6 lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">
          {/* Inputs */}
          <div className="divide-y divide-line rounded-xl border border-line bg-surface">
            <Section id="batch-title" title={t.batchTitle} description={t.batchDesc}>
              <Control
                htmlFor="oil-weight"
                label={t.oilWeight}
                input={
                  <>
                    <NumberInput
                      id="oil-weight"
                      value={oilGrams / u.gramsPer}
                      onCommit={(v) => update({ oilGrams: v * u.gramsPer })}
                      min={L.oilGrams.min / u.gramsPer}
                      max={L.oilGrams.max / u.gramsPer}
                      step={unit === 'g' ? 1 : 0.01}
                      decimals={u.decimals}
                      widthClass="w-20"
                    />
                    <UnitToggle value={unit} onChange={(next) => update({ unit: next })} />
                  </>
                }
                slider={
                  <Range
                    id="oil-weight-range"
                    label={t.oilWeightAria}
                    value={oilGrams}
                    min={L.oilGrams.sliderMin}
                    max={L.oilGrams.sliderMax}
                    step={L.oilGrams.step}
                    valueText={fmtW(oilGrams)}
                    onChange={(v) => update({ oilGrams: v })}
                  />
                }
                footer={[fmtU(L.oilGrams.sliderMin, unit), unit === 'g' ? '' : fmtW(oilGrams), fmtU(L.oilGrams.sliderMax, unit)]}
              />
              <Control
                htmlFor="water-ratio"
                label={t.waterRatio}
                input={
                  <NumberInput
                    id="water-ratio"
                    value={waterRatio}
                    onCommit={(v) => update({ waterRatio: v })}
                    min={L.waterRatio.min}
                    max={L.waterRatio.max}
                    step={L.waterRatio.step}
                    decimals={2}
                    suffix=": 1"
                    widthClass="w-14"
                  />
                }
                slider={
                  <Range
                    id="water-ratio-range"
                    label={t.waterRatio}
                    value={waterRatio}
                    min={L.waterRatio.min}
                    max={L.waterRatio.max}
                    step={L.waterRatio.step}
                    valueText={`${waterRatio.toFixed(1)} : 1`}
                    onChange={(v) => update({ waterRatio: v })}
                  />
                }
                footer={['1.5 : 1', t.lyeConc(`${r.lyeConcentration.toFixed(1)}%`), '3.0 : 1']}
              />
            </Section>

            <Section
              id="oils-title"
              title={t.oilsTitle}
              description={t.oilsDesc}
              badge={
                <span
                  className={`mt-0.5 inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 font-mono text-xs font-medium tabular-nums ${
                    r.balanced ? 'bg-ok-soft text-ok' : 'bg-warn-soft text-warn'
                  }`}
                >
                  {r.balanced ? <CheckIcon className="h-3 w-3" /> : <WarnIcon className="h-3 w-3" />}
                  {fmtPct(r.pctTotal)}
                </span>
              }
            >
              <PresetButtons pct={pct} onApply={(next) => update({ pct: { ...next } })} />
              {r.oils.map((o) => (
                <Control
                  key={o.key}
                  htmlFor={`pct-${o.key}`}
                  label={
                    <>
                      <span className="h-2.5 w-2.5 shrink-0 rounded-[2px]" style={{ background: o.color }} aria-hidden="true" />
                      <span className="truncate">{t.oils[o.key]}</span>
                    </>
                  }
                  input={
                    <NumberInput
                      id={`pct-${o.key}`}
                      value={o.pct}
                      onCommit={(v) => setPct(o.key, v)}
                      min={L.pct.min}
                      max={L.pct.max}
                      step={0.1}
                      decimals={1}
                      suffix="%"
                      widthClass="w-14"
                    />
                  }
                  slider={
                    <Range
                      id={`pct-${o.key}-range`}
                      label={t.pctAria(t.oils[o.key])}
                      value={o.pct}
                      min={L.pct.min}
                      max={L.pct.max}
                      step={L.pct.step}
                      fill={o.color}
                      valueText={fmtPct(o.pct)}
                      onChange={(v) => setPct(o.key, v)}
                    />
                  }
                  footer={[t.sap(o.sap.toFixed(3)), <span className="font-mono tabular-nums text-ink-2">{fmtW(o.grams)}</span>]}
                />
              ))}
              <BlendStatus
                pct={pct}
                total={r.pctTotal}
                onScale={() => update({ pct: normalizeBlend(pct) })}
                onBalance={() => setPct('olive', round1(Math.max(0, 100 - pct.coconut - pct.castor)))}
              />
            </Section>

            <Section id="additives-title" title={t.additivesTitle} description={t.additivesDesc}>
              <Control
                htmlFor="superfat"
                label={t.superfat}
                input={
                  <NumberInput
                    id="superfat"
                    value={superfat}
                    onCommit={(v) => update({ superfat: v })}
                    min={L.superfat.min}
                    max={L.superfat.max}
                    step={L.superfat.step}
                    decimals={1}
                    suffix="%"
                    widthClass="w-14"
                  />
                }
                slider={
                  <Range
                    id="superfat-range"
                    label={t.superfatAria}
                    value={superfat}
                    min={L.superfat.min}
                    max={L.superfat.max}
                    step={L.superfat.step}
                    valueText={fmtPct(superfat)}
                    onChange={(v) => update({ superfat: v })}
                  />
                }
                footer={[t.sfLow, t.lyeCut(fmtW(r.unadjustedLye - r.lye)), t.sfHigh]}
              />
              <Control
                htmlFor="eo-rate"
                label={t.eoUsage}
                input={
                  <NumberInput
                    id="eo-rate"
                    value={eoRate}
                    onCommit={(v) => update({ eoRate: v })}
                    min={L.eoRate.min}
                    max={L.eoRate.max}
                    step={L.eoRate.step}
                    decimals={1}
                    suffix={t.gPerKg}
                    widthClass="w-12"
                  />
                }
                slider={
                  <Range
                    id="eo-rate-range"
                    label={t.eoAria}
                    value={eoRate}
                    min={L.eoRate.min}
                    max={L.eoRate.max}
                    step={L.eoRate.step}
                    fill={COLORS.eo}
                    valueText={`${eoRate} ${t.gPerKg}`}
                    onChange={(v) => update({ eoRate: v })}
                  />
                }
                footer={[`15 ${t.gPerKg}`, t.eoShare(fmtPct(eoRate / 10), fmtW(r.eo)), `45 ${t.gPerKg}`]}
              />
            </Section>
          </div>

          {/* Output */}
          <div className="flex min-w-0 flex-col gap-6">
            <RecipeCard r={r} state={state} hoverKey={hoverKey} onHover={setHoverKey} cardRef={recipeRef} />
            <BreakdownCard r={r} hoverKey={hoverKey} onHover={setHoverKey} />
          </div>
        </div>

        <footer className="mt-8 max-w-2xl text-xs leading-relaxed text-muted">{t.footer}</footer>

        {!recipeInView && <SummaryBar r={r} />}
      </div>
    </LocaleContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SoapCalculator />);
</script>
</body>
</html>
